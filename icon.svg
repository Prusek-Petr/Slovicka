<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="shield-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="shield-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)"/>
  
  <!-- Outer Shield Ring -->
  <path d="M 256 64 C 360 64 416 112 416 240 C 416 352 320 424 256 456 C 192 424 96 352 96 240 C 96 112 152 64 256 64 Z" fill="url(#shield-outer)" stroke="#fca5a5" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Middle Shield Ring -->
  <path d="M 256 96 C 336 96 376 136 376 240 C 376 328 298 384 256 412 C 214 384 136 328 136 240 C 136 136 176 96 256 96 Z" fill="url(#shield-mid)" stroke="#7dd3fc" stroke-width="3"/>
  
  <!-- Inner Shield Core -->
  <path d="M 256 128 C 312 128 340 160 340 240 C 340 306 278 350 256 370 C 234 350 172 306 172 240 C 172 160 200 128 256 128 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  
  <!-- Book / V Emblem in Center -->
  <path d="M 200 210 L 256 170 L 312 210 L 312 300 L 256 260 L 200 300 Z" fill="url(#gold-grad)" stroke="#fef08a" stroke-width="3"/>
  <path d="M 256 170 L 256 260" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Star Accent -->
  <polygon points="256,180 263,198 282,198 266,209 272,227 256,215 240,227 246,209 230,198 249,198" fill="#ffffff"/>
</svg>
